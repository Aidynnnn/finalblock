specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  # ─────────────────────────────────────────────────────────────────
  # AMM — ConstantProductAMM
  # ─────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: ConstantProductAMM
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000001"   # replace with deployed address
      abi: ConstantProductAMM
      startBlock: 0   # replace with deployment block for efficiency
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Pool
        - Swap
        - LiquidityEvent
        - ProtocolDayData
      abis:
        - name: ConstantProductAMM
          file: ./abis/ConstantProductAMM.json
      eventHandlers:
        - event: Swap(indexed address,indexed address,uint256,uint256)
          handler: handleSwap
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
        - event: ReservesUpdated(uint256,uint256)
          handler: handleReservesUpdated
      file: ./src/mappings/amm.ts

  # ─────────────────────────────────────────────────────────────────
  # Vault — VaultFactory (creates ERC4626VaultV1 proxy instances)
  # ─────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: VaultFactory
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000002"   # replace with deployed address
      abi: VaultFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - VaultFactory
        - Vault
        - ProtocolDayData
      abis:
        - name: VaultFactory
          file: ./abis/VaultFactory.json
      eventHandlers:
        - event: VaultDeployed(indexed address,indexed address,indexed address,address)
          handler: handleVaultDeployed
        - event: VaultDeployedDeterministic(indexed address,indexed bytes32,indexed address,address,address)
          handler: handleVaultDeployedDeterministic
      file: ./src/mappings/vault.ts

  # ─────────────────────────────────────────────────────────────────
  # Governance — ProtocolGovernor
  # ─────────────────────────────────────────────────────────────────
  - kind: ethereum
    name: ProtocolGovernor
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000003"   # replace with deployed address
      abi: ProtocolGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
        - ProtocolDayData
      abis:
        - name: ProtocolGovernor
          file: ./abis/ProtocolGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
      file: ./src/mappings/governor.ts

# ─────────────────────────────────────────────────────────────────
# Template — dynamically-created ERC4626 vault proxies
# Each VaultDeployed / VaultDeployedDeterministic event triggers
# ERC4626VaultV1Template.create(proxyAddress) in vault.ts.
# ─────────────────────────────────────────────────────────────────
templates:
  - kind: ethereum
    name: ERC4626VaultV1Template
    network: sepolia
    source:
      abi: ERC4626VaultV1
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultDeposit
        - VaultWithdrawal
        - ProtocolDayData
      abis:
        - name: ERC4626VaultV1
          file: ./abis/ERC4626VaultV1.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: Paused(address)
          handler: handlePaused
        - event: Unpaused(address)
          handler: handleUnpaused
        - event: PriceFeedAdapterUpdated(indexed address,indexed address)
          handler: handlePriceFeedAdapterUpdated
      file: ./src/mappings/vault.ts
